ap:
  image:
    repository: ghcr.io/llm-d/llm-d-async
    tag: "938cd44"
  imagePullPolicy: Always
  igwBaseURL: "http://llm-d-inference-gateway-istio:80"
  messageQueueImpl: "redis-sortedset"
  concurrency: 4
  prometheusURL: "http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090"
  metrics:
    enabled: true
    port: 9090
    secure: false
  redis:
    enabled: true
    url: "redis://redis-master.redis.svc.cluster.local:6379"
    resultQueueName: "result-list"
    pollIntervalMs: 1000
    batchSize: 10
    queuesConfig:
      - queue_name: "request-sortedset"
        request_path_url: "/v1/completions"
        igw_base_url: "http://llm-d-inference-gateway-istio:80"
        gate_type: "prometheus-budget"
        gate_params:
          pool: "optimized-baseline"
          # Per *ready pod* request capacity, not a pool-wide total: the gate
          # closes once load reaches ready_pods * max_concurrency * (1 - baseline),
          # i.e. 95 concurrent requests on the single Qwen3-0.6B replica this
          # guide deploys. 100 matches the EPP saturation detector's default and
          # is reachable by the guide's own load test (hey, 200 workers).
          # Re-derive it for your own model and hardware -- a value your pool
          # never reaches leaves the gate permanently open. See the
          # "Size max_concurrency for your pool" section of the guide.
          max_concurrency: "100"
          baseline: "0.05"
  podMonitor:
    enabled: true
    interval: "15s"
  prometheusRule:
    enabled: true
  grafana:
    dashboards:
      enabled: true
  modelServerMonitor:
    enabled: true
    selector:
      llm-d.ai/role: decode
    port: modelserver
    path: /metrics
    interval: 15s
